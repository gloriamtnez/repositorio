<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020d1a">
  <title>Puente Romano Marbella — Código de acceso</title>
  <link rel="preload" as="image" href="./puente-romano-azul-1.png">
  <link rel="preload" as="audio" href="./musica-exito.mp3" type="audio/mpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--deep:#020d1a;--ocean:#041828;--teal:#0e7490;--cyan:#22d3ee;--gold:#f59e0b;--gold2:#fcd34d;--white:#f0f9ff;--muted:#7fb3c8;--danger:#ef4444;--success:#10b981}
    *{box-sizing:border-box} html,body{min-height:100%;margin:0} body{font-family:Rajdhani,system-ui,sans-serif;background:var(--deep);color:var(--white);overflow:hidden}
    button,input{font:inherit} button{cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;isolation:isolate}.scan{position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px)}
    #cover{z-index:2;background:radial-gradient(ellipse at 30% 20%,rgba(14,116,144,.35),transparent 55%),radial-gradient(ellipse at 70% 80%,rgba(2,13,26,.9),transparent 60%),linear-gradient(160deg,#041828,#020d1a 70%);transition:opacity .65s ease}.cover-content{position:relative;text-align:center;padding:24px;max-width:760px}.logo{display:block;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 0 10px rgba(255,255,255,.25));margin:0 auto}.logo-cover{height:clamp(48px,8vw,84px);margin-bottom:56px}.logo-game{height:40px;margin-bottom:28px}
    .eyebrow{font-family:Orbitron,monospace;font-size:clamp(10px,2vw,16px);letter-spacing:5px;color:var(--cyan);margin:0 0 12px}.cover h1{font-family:Cinzel,serif;font-size:clamp(28px,6vw,64px);line-height:1.15;margin:0;text-shadow:0 0 40px rgba(34,211,238,.4),0 2px 8px #000}.subtitle{font-family:Cinzel,serif;font-size:clamp(16px,3vw,30px);letter-spacing:3px;color:var(--cyan);margin:8px 0 48px}.start{border:0;background:transparent;color:var(--gold);font-weight:700;letter-spacing:4px;font-size:clamp(13px,2vw,18px);text-transform:uppercase;animation:pulse 2s ease-in-out infinite}.start:focus-visible,.action:focus-visible,input:focus-visible{outline:3px solid var(--gold2);outline-offset:4px}@keyframes pulse{50%{opacity:.45}}
    .ring{position:absolute;border-radius:50%;border:1px solid rgba(34,211,238,.16);width:clamp(200px,45vw,600px);aspect-ratio:1;animation:sonar 4s ease-out infinite;pointer-events:none}.ring.one{top:10%;left:5%}.ring.two{right:0;bottom:3%;animation-delay:1.5s}@keyframes sonar{from{opacity:.6;transform:scale(.45)}to{opacity:0;transform:scale(1)}}
    #game{display:none;background:radial-gradient(ellipse at 20% 50%,rgba(14,116,144,.15),transparent 50%),radial-gradient(ellipse at 80% 30%,#0a2540,transparent 60%),linear-gradient(180deg,#020d1a,#041828 50%,#020d1a);overflow:hidden}.bubbles{position:absolute;inset:0;overflow:hidden;background-image:linear-gradient(rgba(34,211,238,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.04) 1px,transparent 1px);background-size:60px 60px}.bubble{position:absolute;bottom:-3rem;border-radius:50%;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.12);animation:rise linear infinite}@keyframes rise{to{transform:translateY(-115vh);opacity:0}}
    .inner{z-index:1;width:min(520px,92vw);text-align:center}.terminal{position:relative;padding:34px 30px;border:1px solid rgba(34,211,238,.22);border-radius:16px;background:rgba(4,24,40,.9);box-shadow:0 0 60px rgba(34,211,238,.06),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(16px);overflow:hidden}.terminal:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),var(--cyan),transparent)}.sonar{height:72px;width:72px;margin:0 auto 20px;position:relative}.sonar i,.sonar b{position:absolute;top:50%;left:50%;border-radius:50%;transform:translate(-50%,-50%)}.sonar i{border:1px solid rgba(34,211,238,.4);animation:ping 2s ease-out infinite}.sonar i:nth-child(1){width:28px;height:28px}.sonar i:nth-child(2){width:48px;height:48px;animation-delay:.5s}.sonar i:nth-child(3){width:68px;height:68px;animation-delay:1s}.sonar b{width:14px;height:14px;background:var(--cyan);box-shadow:0 0 15px var(--cyan)}@keyframes ping{from{opacity:.8;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(1)}}
    .tag{font-family:Orbitron,monospace;font-size:10px;letter-spacing:4px;color:var(--teal);margin-bottom:8px}.terminal h2{font:700 clamp(20px,4vw,28px) Cinzel,serif;margin:0 0 5px}.desc{margin:0 0 24px;color:var(--muted);letter-spacing:1px}.code{width:100%;padding:16px 20px;border:1px solid rgba(34,211,238,.3);border-radius:10px;background:rgba(2,13,26,.8);color:var(--cyan);caret-color:var(--gold);text-align:center;text-transform:uppercase;letter-spacing:2px;font:700 clamp(13px,3.4vw,19px) Orbitron,monospace}.code::placeholder{color:#6894a8;font-size:.72em}.dots{display:flex;justify-content:center;gap:6px;margin:12px 0}.dot{width:6px;height:6px;border-radius:50%;border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.15)}.dot.active{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}.action{width:100%;padding:17px;border:1px solid rgba(34,211,238,.45);border-radius:10px;background:linear-gradient(135deg,rgba(14,116,144,.85),rgba(34,211,238,.32));color:var(--white);font:700 14px Orbitron,monospace;letter-spacing:3px;transition:.2s}.action:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(34,211,238,.25)}
    .result{display:none}.result.show{display:flex;flex-direction:column;gap:18px;align-items:center}.badge{display:grid;place-items:center;width:80px;height:80px;border:2px solid var(--success);border-radius:50%;font-size:36px;background:rgba(16,185,129,.15);box-shadow:0 0 30px rgba(16,185,129,.3)}.result h2{font:700 clamp(15px,3.4vw,22px) Cinzel,serif;line-height:1.35;margin:0}.result h2 span{display:block;color:var(--gold)}.result p{margin:0;color:var(--muted);font-size:12px;letter-spacing:2px}.player{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px;border:1px solid rgba(16,185,129,.22);border-radius:10px;background:rgba(16,185,129,.08)}.disc{font-size:20px;animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.player strong{font-size:13px;color:var(--gold)}.bar-wrap{height:3px;background:rgba(255,255,255,.12);margin-top:6px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2))}.retry{width:auto;padding:12px 28px;background:transparent}.fail .badge{border-color:var(--danger);background:rgba(239,68,68,.15);box-shadow:0 0 30px rgba(239,68,68,.2)}.fail h2{color:var(--danger)}.shake{animation:shake .4s ease}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
    .depth{position:absolute;right:20px;top:50%;z-index:1;opacity:.45;display:grid;place-items:center;gap:6px}.depth span{font:8px Orbitron,monospace;color:var(--teal);writing-mode:vertical-rl;letter-spacing:2px}.depth i{height:120px;width:3px;background:rgba(34,211,238,.13);position:relative;overflow:hidden}.depth i:after{content:"";position:absolute;inset:auto 0 0;height:70%;background:linear-gradient(var(--cyan),transparent);animation:depth 3s ease-in-out infinite alternate}@keyframes depth{to{height:20%}}#confetti{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-3vh;animation:fall 4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@media(max-width:480px){.terminal{padding:28px 20px}.depth{display:none}.logo-cover{margin-bottom:40px}}
    /* La portada se elimina de la interacción tras iniciar: evita una capa transparente sobre los botones. */
    #cover[hidden]{display:none}
  </style>
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <section id="cover" class="screen cover" aria-labelledby="cover-title">
    <span class="ring one" aria-hidden="true"></span><span class="ring two" aria-hidden="true"></span>
    <div class="cover-content"><img class="logo logo-cover" src="./puente-romano-azul-1.png" alt="Puente Romano Marbella"><p class="eyebrow">Experiencia exclusiva</p><h1 id="cover-title">Código de acceso</h1><p class="subtitle">Puente Romano Marbella</p><button class="start" id="start" type="button">▶&nbsp; Pulsa para continuar &nbsp;◀</button></div>
  </section>
  <main id="game" class="screen" aria-hidden="true"><div class="bubbles" id="bubbles" aria-hidden="true"></div><div class="depth" aria-hidden="true"><span>NIVEL</span><i></i></div><div class="inner"><img class="logo logo-game" src="./puente-romano-azul-1.png" alt="Puente Romano Marbella"><section class="terminal" aria-live="polite"><div id="entry"><div class="sonar" aria-hidden="true"><i></i><i></i><i></i><b></b></div><div class="tag">◈ Sistema de verificación ◈</div><h2>Código de acceso</h2><p class="desc">Introduce la clave para continuar</p><label class="sr-only" for="code">Código de acceso</label><input class="code" id="code" type="text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="INTRODUCE EL CÓDIGO"><div class="dots" id="dots" aria-hidden="true"></div><button class="action" id="verify" type="button">⬡ Verificar acceso ⬡</button></div><div id="success" class="result"><div class="badge">🏛️</div><h2>Tu acompañamiento <span>transforma experiencias</span></h2><p>◈ Acceso concedido ◈</p><div class="player"><span class="disc">🎵</span><div style="flex:1"><strong>Pista de éxito</strong><div class="bar-wrap"><div class="bar" id="bar"></div></div></div></div><button class="action retry" type="button">↩ Nueva verificación</button></div><div id="failure" class="result fail"><div class="badge">⚠</div><h2 id="failure-message">Código incorrecto<br>Acceso denegado</h2><p>◈ Intento no válido ◈</p><button class="action retry" type="button">↩ Reintentar</button></div></section></div></main>
  <div id="confetti" aria-hidden="true"></div><audio id="success-audio" preload="metadata" src="./musica-exito.mp3"></audio><audio id="fail-audio" preload="metadata" src="./musica-fallo.mp3"></audio>
  <script>
    (()=>{const CODE='TUACOMPANAMIENTOTRANSFORMAEXPERIENCIAS',q=s=>document.querySelector(s),code=q('#code'),entry=q('#entry'),success=q('#success'),failure=q('#failure'),okAudio=q('#success-audio'),failAudio=q('#fail-audio'),bar=q('#bar');let raf=0;const normalize=s=>s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');const dots=q('#dots');for(let i=0;i<6;i++)dots.insertAdjacentHTML('beforeend','<i class="dot"></i>');const updateDots=()=>[...dots.children].forEach((dot,i)=>dot.classList.toggle('active',i<Math.min(normalize(code.value).length,6)));for(let i=0;i<18;i++){const bubble=document.createElement('i');bubble.className='bubble';const n=4+Math.random()*20;bubble.style.cssText=`width:${n}px;height:${n}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*14}s;animation-delay:${Math.random()*12}s`;q('#bubbles').append(bubble)}q('#start').addEventListener('click',()=>{q('#cover').style.opacity='0';setTimeout(()=>{q('#cover').hidden=true;q('#game').style.display='flex';q('#game').setAttribute('aria-hidden','false');code.focus()},650)});code.addEventListener('input',updateDots);code.addEventListener('keydown',e=>{if(e.key==='Enter')verify()});q('#verify').addEventListener('click',verify);function play(audio){audio.currentTime=0;audio.play().catch(()=>{})}function verify(){if(!code.value.trim())return;if(normalize(code.value)===CODE){entry.hidden=true;success.classList.add('show');play(okAudio);progress();confetti()}else{play(failAudio);code.classList.add('shake');setTimeout(()=>code.classList.remove('shake'),450);q('#failure-message').innerHTML=['Código incorrecto<br>Acceso denegado','Clave inválida<br>Inténtalo de nuevo','Datos no reconocidos<br>Acceso bloqueado'][Math.floor(Math.random()*3)];entry.hidden=true;failure.classList.add('show')}}function progress(){cancelAnimationFrame(raf);const start=performance.now(),duration=(okAudio.duration||180)*1000;const step=t=>{bar.style.width=Math.min(100,(t-start)/duration*100)+'%';if(t-start<duration)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}function confetti(){const layer=q('#confetti'),icons=['🏛️','⭐','✨','💛','🏅','💎'];for(let i=0;i<110;i++){const item=document.createElement('span');item.className='confetti';item.textContent=icons[i%icons.length];item.style.cssText=`left:${Math.random()*100}vw;animation-delay:${Math.random()*.9}s;font-size:${16+Math.random()*18}px`;layer.append(item);setTimeout(()=>item.remove(),5500)}}function reset(){cancelAnimationFrame(raf);okAudio.pause();failAudio.pause();okAudio.currentTime=failAudio.currentTime=0;bar.style.width='0';success.classList.remove('show');failure.classList.remove('show');entry.hidden=false;code.value='';updateDots();code.focus()}document.querySelectorAll('.retry').forEach(button=>button.addEventListener('click',reset))})();
  </script>
  <script>
    const missionAsset = './mision-nautilus-blanco-transparente.png';
    const coverMission = document.createElement('img');
    coverMission.src = missionAsset;
    coverMission.alt = 'Misión Nautilus';
    coverMission.className = 'logo-mision-nautilus';
    coverMission.style.cssText = 'display:block; width:clamp(78px,11vw,112px); height:auto; object-fit:contain; filter:none; margin:-42px auto 8px;';
    document.querySelector('.logo-cover').insertAdjacentElement('afterend', coverMission);

    const systemMission = document.createElement('img');
    systemMission.src = missionAsset;
    systemMission.alt = 'Misión Nautilus';
    systemMission.className = 'logo-mision-nautilus';
    systemMission.style.cssText = 'display:block; width:86px; height:auto; object-fit:contain; filter:none; margin:0 auto 14px;';
    document.querySelector('#game .sonar').replaceWith(systemMission);

    document.querySelector('#failure .retry').addEventListener('click', () => {
      document.querySelector('#failure').classList.remove('show');
      document.querySelector('#entry').hidden = false;
      const codeField = document.querySelector('#code');
      codeField.value = '';
      document.querySelectorAll('#dots .dot').forEach((dot) => dot.classList.remove('active'));
      codeField.focus();
    });
  </script>
</body>
</html>
