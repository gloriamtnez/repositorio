<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020d1a">
  <title>Misión Nautilus — Cronómetro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--deep:#020d1a;--ocean:#041828;--teal:#0e7490;--cyan:#22d3ee;--gold:#f59e0b;--gold2:#fcd34d;--white:#f0f9ff;--muted:#7fb3c8;--danger:#ef4444;--warn:#f97316}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--deep);color:var(--white);font-family:Rajdhani,system-ui,sans-serif;overflow-x:hidden}body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;background:repeating-linear-gradient(0deg,rgba(0,0,0,.025) 0 1px,transparent 1px 3px)}
    .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 50%,rgba(14,116,144,.14),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(10,37,64,.7),transparent 60%),linear-gradient(180deg,#020d1a,#041828 50%,#020d1a)}.bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px);background-size:60px 60px}.bubble{position:absolute;bottom:-3rem;border:1px solid rgba(34,211,238,.1);border-radius:50%;background:rgba(34,211,238,.05);animation:rise linear infinite}@keyframes rise{to{transform:translateY(-115vh);opacity:0}}
    main{width:min(700px,calc(100% - 32px));min-height:100vh;margin:auto;padding:28px 0 42px;display:flex;flex-direction:column;gap:18px}.logos{display:flex;align-items:center;justify-content:center;gap:clamp(24px,6vw,56px);padding:10px 20px 18px}.puente{height:clamp(64px,11vw,104px);width:auto;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 0 12px rgba(255,255,255,.2))}.nautilus{height:clamp(75px,13vw,124px);width:auto;object-fit:contain;filter:drop-shadow(0 0 12px rgba(255,255,255,.18))}.divider{width:1px;align-self:stretch;background:linear-gradient(transparent,rgba(34,211,238,.45),transparent)}
    .panel{position:relative;border:1px solid rgba(34,211,238,.2);border-radius:16px;background:rgba(4,24,40,.86);box-shadow:0 0 60px rgba(34,211,238,.05),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(18px)}.panel:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),var(--cyan),transparent);opacity:.7}.timer{padding:30px 24px;display:flex;flex-direction:column;align-items:center;gap:22px}.kicker{font:700 10px Orbitron,monospace;letter-spacing:4px;text-transform:uppercase;color:var(--teal);text-align:center;margin:0}.timer h1{font:700 clamp(18px,4vw,28px) Cinzel,serif;letter-spacing:.05em;text-align:center;margin:-12px 0 0}.ring{position:relative;width:clamp(210px,55vw,280px);aspect-ratio:1}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.track{fill:none;stroke:rgba(34,211,238,.09);stroke-width:8}.arc{fill:none;stroke:var(--cyan);stroke-width:8;stroke-linecap:round;stroke-dasharray:659.73;filter:drop-shadow(0 0 8px rgba(34,211,238,.7));transition:stroke-dashoffset .8s linear,stroke .25s}.centre{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.time{font:700 clamp(38px,10vw,62px) Orbitron,monospace;color:var(--cyan);letter-spacing:-.05em;line-height:1;text-shadow:0 0 24px rgba(34,211,238,.55)}.state{margin-top:10px;font:9px Orbitron,monospace;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}.progress{width:100%;height:4px;overflow:hidden;border-radius:3px;background:rgba(34,211,238,.1)}.progress i{display:block;width:100%;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .8s linear}
    .controls{display:flex;width:100%;gap:10px;flex-wrap:wrap}.button{border:1px solid rgba(34,211,238,.32);border-radius:10px;background:rgba(34,211,238,.06);color:var(--cyan);padding:14px 12px;font:700 11px Orbitron,monospace;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.2s}.button:hover{transform:translateY(-1px);border-color:var(--cyan);background:rgba(34,211,238,.14)}.button:focus-visible,input:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}.primary{flex:2;min-width:180px;background:linear-gradient(135deg,rgba(14,116,144,.85),rgba(34,211,238,.32));color:var(--white)}.small{flex:1;min-width:105px}
    .custom{padding:20px}.custom h2{margin:0 0 14px;color:var(--teal);font:700 10px Orbitron,monospace;letter-spacing:3px;text-transform:uppercase}.custom-row{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.time-input{width:82px;border:1px solid rgba(34,211,238,.25);border-radius:8px;background:rgba(2,13,26,.85);color:var(--cyan);padding:10px;font:700 20px Orbitron,monospace;text-align:center}.sep{font:700 24px Orbitron,monospace;color:var(--cyan);opacity:.55}.apply{border-color:rgba(245,158,11,.45);color:var(--gold);background:rgba(245,158,11,.1)}.quick{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}.quick button{border:1px solid rgba(34,211,238,.2);border-radius:7px;background:rgba(34,211,238,.05);color:var(--muted);padding:7px 11px;font:9px Orbitron,monospace;letter-spacing:1px;cursor:pointer}.quick button:hover{color:var(--cyan);border-color:var(--cyan)}.meter{position:fixed;right:16px;top:50%;z-index:2;display:grid;place-items:center;gap:6px;opacity:.35}.meter span{font:8px Orbitron,monospace;letter-spacing:2px;color:var(--teal);writing-mode:vertical-rl}.meter i{width:3px;height:120px;overflow:hidden;background:rgba(34,211,238,.1)}.meter i:after{content:"";display:block;width:100%;height:70%;background:linear-gradient(var(--cyan),transparent);animation:depth 3s ease-in-out infinite alternate}@keyframes depth{to{height:18%}}.complete{display:none;position:fixed;inset:0;z-index:30;place-content:center;text-align:center;gap:18px;background:rgba(2,13,26,.96);padding:24px}.complete.show{display:grid}.complete b{font-size:70px}.complete h2{margin:0;font:900 clamp(28px,7vw,48px) Cinzel,serif}.complete p{margin:0;color:var(--cyan);font:12px Orbitron,monospace;letter-spacing:4px}@media(max-width:480px){main{padding-top:16px}.logos{gap:20px}.meter{display:none}.timer{padding:24px 17px}.custom{padding:18px 14px}}
  </style>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div><aside class="meter" aria-hidden="true"><span>DEPTH</span><i></i><span>m</span></aside>
  <main>
    <header class="logos" aria-label="Puente Romano Marbella y Misión Nautilus"><img class="puente" src="./puente-romano-azul-1.png" alt="Puente Romano Marbella"><span class="divider"></span><img class="nautilus" src="./mision-nautilus-blanco-transparente.png" alt="Misión Nautilus"></header>
    <section class="panel timer" aria-labelledby="timer-title"><p class="kicker">◈ Sistema de control ◈</p><h1 id="timer-title">Cronómetro de misión</h1><div class="ring"><svg viewBox="0 0 220 220" aria-hidden="true"><circle class="track" cx="110" cy="110" r="105"/><circle class="arc" id="arc" cx="110" cy="110" r="105"/></svg><div class="centre"><output class="time" id="display" aria-live="polite">05:00</output><div class="state" id="state">Sistema en espera</div></div></div><div class="progress"><i id="progress"></i></div><div class="controls"><button class="button primary" id="toggle" type="button">▶ Iniciar</button><button class="button small" id="reset" type="button">↺ Reset</button></div></section>
    <section class="panel custom" aria-labelledby="custom-title"><h2 id="custom-title">◈ Tiempo personalizado ◈</h2><div class="custom-row"><label><span class="sr-only">Minutos</span><input class="time-input" id="minutes" type="number" min="0" max="99" value="5" inputmode="numeric"></label><span class="sep">:</span><label><span class="sr-only">Segundos</span><input class="time-input" id="seconds" type="number" min="0" max="59" value="0" inputmode="numeric"></label><button class="button apply" id="apply" type="button">⬡ Aplicar</button></div><div class="quick"><button type="button" data-time="60">1 MIN</button><button type="button" data-time="120">2 MIN</button><button type="button" data-time="300">5 MIN</button><button type="button" data-time="600">10 MIN</button><button type="button" data-time="900">15 MIN</button><button type="button" data-time="1200">20 MIN</button></div></section>
  </main>
  <section class="complete" id="complete" aria-live="assertive"><b>⚓</b><h2>Tiempo completado</h2><p>◈ MISIÓN FINALIZADA ◈</p><button class="button primary" id="restart" type="button">↩ Reiniciar cronómetro</button></section>
  <script>
    (()=>{const q=s=>document.querySelector(s),C=2*Math.PI*105;let remaining=300,total=300,running=false,timerId=null,ctx=null;const display=q('#display'),arc=q('#arc'),progress=q('#progress'),state=q('#state'),toggle=q('#toggle');function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function draw(){const ratio=total?remaining/total:0;display.textContent=format(remaining);arc.style.strokeDashoffset=C*(1-ratio);progress.style.width=`${ratio*100}%`;const urgent=running&&remaining<=60;const critical=running&&remaining<=15;const color=critical?'#ef4444':urgent?'#f97316':'#22d3ee';arc.style.stroke=color;display.style.color=color;progress.style.background=critical?'#ef4444':urgent?'#f97316':'linear-gradient(90deg,#22d3ee,#f59e0b)'}function sound(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const now=ctx.currentTime;[0,.22,.44].forEach(offset=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.setValueAtTime(.35,now+offset);g.gain.exponentialRampToValueAtTime(.001,now+offset+.18);o.start(now+offset);o.stop(now+offset+.2)})}catch{}}function pause(){clearInterval(timerId);running=false;toggle.textContent='▶ Reanudar';state.textContent='En pausa'}function complete(){clearInterval(timerId);running=false;toggle.textContent='▶ Iniciar';state.textContent='Tiempo completado';sound();q('#complete').classList.add('show')}function start(){if(remaining<=0)return;running=true;toggle.textContent='⏸ Pausar';state.textContent='Misión en curso';timerId=setInterval(()=>{remaining--;draw();if(remaining<=0)complete()},1000)}function setTime(seconds){pause();remaining=total=Math.max(1,seconds);toggle.textContent='▶ Iniciar';state.textContent='Sistema en espera';draw()}q('#toggle').addEventListener('click',()=>running?pause():start());q('#reset').addEventListener('click',()=>setTime(total));q('#apply').addEventListener('click',()=>{const m=Math.max(0,Math.min(99,Number(q('#minutes').value)||0)),s=Math.max(0,Math.min(59,Number(q('#seconds').value)||0));setTime(m*60+s||1)});document.querySelectorAll('[data-time]').forEach(button=>button.addEventListener('click',()=>{const seconds=Number(button.dataset.time);q('#minutes').value=Math.floor(seconds/60);q('#seconds').value=seconds%60;setTime(seconds)}));q('#restart').addEventListener('click',()=>{q('#complete').classList.remove('show');setTime(total)});for(let i=0;i<18;i++){const b=document.createElement('i'),size=4+Math.random()*18;b.className='bubble';b.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*14}s;animation-delay:${Math.random()*12}s`;q('#bg').append(b)}draw()})();
  </script>
  <script>
    /* Alarma derivada del cronómetro de referencia: tres pulsos, barrido ascendente y golpe final. */
    (() => {
      const display = document.querySelector('#display');
      const state = document.querySelector('#state');
      let alarmPlayed = false;
      let context;

      function unlockAudio() {
        context ??= new (window.AudioContext || window.webkitAudioContext)();
        if (context.state === 'suspended') context.resume().catch(() => {});
        return context;
      }
      document.querySelector('#toggle').addEventListener('pointerdown', unlockAudio);

      const secondsOnDisplay = () => {
        const [minutes, seconds] = display.textContent.split(':').map(Number);
        return minutes * 60 + seconds;
      };

      function tone(ctx, frequency, at, duration, volume, type = 'sine') {
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.connect(gain); gain.connect(ctx.destination);
        oscillator.type = type; oscillator.frequency.setValueAtTime(frequency, at);
        gain.gain.setValueAtTime(0, at);
        gain.gain.linearRampToValueAtTime(volume, at + 0.01);
        gain.gain.setValueAtTime(volume, at + duration - 0.02);
        gain.gain.linearRampToValueAtTime(0, at + duration);
        oscillator.start(at); oscillator.stop(at + duration);
      }

      function playFiveSecondAlarm() {
        unlockAudio();
        const now = context.currentTime;
        [0, .42, .84, 1.26, 1.68, 2.10, 2.52, 2.94, 3.36, 3.78].forEach((offset) => {
          tone(context, 1080, now + offset, .26, .95, 'square');
          tone(context, 720, now + offset + .05, .18, .75, 'square');
        });
        const sweep = context.createOscillator();
        const gain = context.createGain();
        sweep.connect(gain); gain.connect(context.destination);
        sweep.type = 'sawtooth';
        sweep.frequency.setValueAtTime(200, now + 0.9);
        sweep.frequency.exponentialRampToValueAtTime(1200, now + 3);
        gain.gain.setValueAtTime(0, now + 0.9);
        gain.gain.linearRampToValueAtTime(0.7, now + 1.3);
        gain.gain.setValueAtTime(0.7, now + 2.8);
        gain.gain.linearRampToValueAtTime(0, now + 3.2);
        sweep.start(now + 0.9); sweep.stop(now + 3.25);
        tone(context, 80, now + 0.9, 2.4, 0.45, 'sine');
        tone(context, 1760, now + 4.1, 0.4, 0.7, 'sine');
      }

      function checkForFinalFiveSeconds() {
        const seconds = secondsOnDisplay();
        const missionRunning = state.textContent.trim().toUpperCase() === 'MISIÓN EN CURSO';
        if (seconds > 5 || !missionRunning) alarmPlayed = false;
        if (missionRunning && seconds > 0 && seconds <= 5 && !alarmPlayed) {
          alarmPlayed = true;
          playFiveSecondAlarm();
        }
      }

      new MutationObserver(checkForFinalFiveSeconds).observe(display, { childList: true, characterData: true, subtree: true });
      new MutationObserver(checkForFinalFiveSeconds).observe(state, { childList: true, characterData: true, subtree: true });
    })();
  </script>
</body>
</html>
